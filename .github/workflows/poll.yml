name: poll

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: talentticker-poll
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TT_ALERT_TO: ${{ secrets.TT_ALERT_TO }}
      TT_SMTP_HOST: ${{ secrets.TT_SMTP_HOST }}
      TT_SMTP_PORT: ${{ secrets.TT_SMTP_PORT }}
      TT_SMTP_USER: ${{ secrets.TT_SMTP_USER }}
      TT_SMTP_PASS: ${{ secrets.TT_SMTP_PASS }}
      TT_SMTP_FROM: ${{ secrets.TT_SMTP_FROM }}
      TT_CLAUDE_ENABLED: "0"
      TT_SCHEDULER: "0"
      TT_FETCH_CACHE_MINUTES: "0"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Fetch the seen-job state
        run: |
          mkdir -p var
          git fetch origin state:state 2>/dev/null || echo "no state branch yet"
          git show state:state.json.gz > var/state.json.gz 2>/dev/null || echo "no engineering state yet"
          git show state:state-product.json.gz > var/state-product.json.gz 2>/dev/null || echo "no product state yet"

      - name: Check priority boards and email matches
        run: |
          python -m tt setup
          python -m tt state load
          python -m tt poll --tier 1
          python -m tt state save

          TT_PROFILE=product python -m tt setup
          TT_PROFILE=product python -m tt state load --path var/state-product.json.gz
          TT_PROFILE=product python -m tt poll --tier 1
          TT_PROFILE=product python -m tt state save --path var/state-product.json.gz

      - name: Publish the state
        run: |
          rm -rf /tmp/pub && mkdir -p /tmp/pub
          cp var/state.json.gz var/state-product.json.gz /tmp/pub/
          cd /tmp/pub
          git init -q -b state
          git config user.name "talentticker"
          git config user.email "talentticker@users.noreply.github.com"
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git add .
          git commit -q -m "state $(date -u +%Y-%m-%dT%H:%MZ)"
          git push --force origin state
