name: poll

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: talentticker
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TT_ALERT_TO: ${{ secrets.TT_ALERT_TO }}
      TT_SMTP_HOST: ${{ secrets.TT_SMTP_HOST }}
      TT_SMTP_PORT: ${{ secrets.TT_SMTP_PORT }}
      TT_SMTP_USER: ${{ secrets.TT_SMTP_USER }}
      TT_SMTP_PASS: ${{ secrets.TT_SMTP_PASS }}
      TT_SMTP_FROM: ${{ secrets.TT_SMTP_FROM }}
      TT_CLAUDE_ENABLED: "0"
      TT_SCHEDULER: "0"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Restore databases
        uses: actions/cache/restore@v4
        with:
          path: var
          key: tt-db-${{ github.run_id }}
          restore-keys: tt-db-

      - name: Check priority boards and email matches
        run: |
          python -m tt setup
          python -m tt poll --tier 1
          TT_PROFILE=product python -m tt setup
          TT_PROFILE=product python -m tt poll --tier 1

      - name: Save databases
        uses: actions/cache/save@v4
        if: always()
        with:
          path: var
          key: tt-db-${{ github.run_id }}
