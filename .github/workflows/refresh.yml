name: refresh

on:
  schedule:
    - cron: "37 8 * * *"
    - cron: "17 1,4,7,10,13,16,19,22 * * *"
  workflow_dispatch:
    inputs:
      full:
        description: "Full pull of every board"
        type: boolean
        default: false

concurrency:
  group: talentticker
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      TT_ALERT_TO: ${{ secrets.TT_ALERT_TO }}
      TT_SMTP_HOST: ${{ secrets.TT_SMTP_HOST }}
      TT_SMTP_PORT: ${{ secrets.TT_SMTP_PORT }}
      TT_SMTP_USER: ${{ secrets.TT_SMTP_USER }}
      TT_SMTP_PASS: ${{ secrets.TT_SMTP_PASS }}
      TT_SMTP_FROM: ${{ secrets.TT_SMTP_FROM }}
      TT_CLAUDE_ENABLED: "0"
      TT_SCHEDULER: "0"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Restore databases
        uses: actions/cache/restore@v4
        with:
          path: var
          key: tt-db-${{ github.run_id }}
          restore-keys: tt-db-

      - name: Decide whether this run is a full pull
        id: mode
        run: |
          if [ "${{ github.event.schedule }}" = "37 8 * * *" ] || [ "${{ inputs.full }}" = "true" ]; then
            echo "full=true" >> "$GITHUB_OUTPUT"
          else
            echo "full=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Full pull
        if: steps.mode.outputs.full == 'true'
        run: |
          python -m tt setup
          python -m tt refresh
          python -m tt snapshot
          python -m tt vacuum
          TT_PROFILE=product python -m tt setup
          TT_PROFILE=product python -m tt refresh
          TT_PROFILE=product python -m tt snapshot
          TT_PROFILE=product python -m tt vacuum

      - name: Sweep every board
        if: steps.mode.outputs.full != 'true'
        run: |
          python -m tt setup
          python -m tt poll
          TT_PROFILE=product python -m tt setup
          TT_PROFILE=product python -m tt poll

      - name: Build the site
        run: |
          python -m tt export
          TT_PROFILE=product python -m tt export
          cp tt/web/static/app.js tt/web/static/style.css tt/web/static/us-states.json site/

      - name: Save databases
        if: steps.mode.outputs.full == 'true'
        uses: actions/cache/save@v4
        with:
          path: var
          key: tt-db-${{ github.run_id }}

      - name: Deploy to Vercel
        if: env.VERCEL_TOKEN != ''
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_Wf7rP1qNEgd9Hvc5Xt2Cs9h9
          VERCEL_PROJECT_ID: prj_HL77BC1L692WIxHenUr4U6G3QBjR
        run: |
          npm install -g vercel@59 --silent
          cp vercel.json site/vercel.json
          python - <<'PY'
          import json, pathlib
          p = pathlib.Path("site/vercel.json")
          cfg = json.loads(p.read_text(encoding="utf-8"))
          cfg.pop("outputDirectory", None)
          cfg.pop("$schema", None)
          p.write_text(json.dumps(cfg, indent=2), encoding="utf-8")
          PY
          cd site
          vercel deploy --prod --yes --token "$VERCEL_TOKEN"
