# Written by `python -m tt learn-skills --add`. Kept separate from
# taxonomy.py on purpose: that file is curated by hand and should stay
# readable, while this one is machine-generated and safe to delete or edit
# without losing anything you wrote yourself.
#
# Entries here are merged into the dictionary at import time and then counted
# exactly like every other skill - deterministically, on every posting,
# including the 34,000 already stored. Adding one here and running
# `tt reprocess` gives it twelve months of history immediately.
#
# Delete any line that looks wrong; nothing depends on it.

