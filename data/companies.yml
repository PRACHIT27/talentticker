# tier 1   = checked every few minutes (where you most want to be early)
# tier 2   = checked hourly
# sector   = used by the sector analytics page. Edit freely; anything left
#            blank is guessed from the job descriptions instead.
#
# Boards that stop responding are marked inactive automatically, so it is safe
# to guess at a token here.

