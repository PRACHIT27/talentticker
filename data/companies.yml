  # ---- large employers running their own applicant systems ----
  # These are the reason MAANG-scale companies were invisible: none of them use
  # Greenhouse, Ashby or Lever. Amazon has its own platform; most of the rest
  # are on Workday, whose token is tenant:pod:site taken from the careers URL.
  - {ats: amazon, token: "Software Development", name: Amazon, sector: Marketplace, tier: 1}
